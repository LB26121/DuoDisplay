name: Bug report
description: Something doesn't work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Report security problems **privately** via
        *Security → Report a vulnerability* (see SECURITY.md), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect both Macs via Thunderbolt
        2. Press ⌃⌥⌘D
        3. …
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Second display
        - Normal use / edge switch
        - Picture-in-picture
        - Pairing / connecting
        - Sound, camera or microphone
        - Other
    validations:
      required: true
  - type: input
    id: sender
    attributes:
      label: Mac whose screen is shown (e.g. MacBook)
      description: Model and macOS version
      placeholder: MacBook Pro 14" M3, macOS 26.1
    validations:
      required: true
  - type: input
    id: receiver
    attributes:
      label: Mac that shows it (e.g. iMac)
      description: Model and macOS version
      placeholder: iMac 24" M4, macOS 26.1
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DuoDisplay version or commit
    validations:
      required: true
  - type: dropdown
    id: signing
    attributes:
      label: How was the app signed?
      options:
        - Downloaded release
        - Built myself, ad-hoc
        - Built myself, local signing identity
        - Built myself, Apple Developer certificate
  - type: input
    id: connection
    attributes:
      label: Connection
      description: Cable, adapters, docks, other displays attached
      placeholder: Thunderbolt 4 cable directly, no other displays
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Run on both Macs right after the problem:
        `log show --last 10m --predicate 'subsystem == "local.duodisplay"' --style compact`
      render: text
